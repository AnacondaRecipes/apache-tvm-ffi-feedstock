{% set name="apache-tvm-ffi" %}
{% set version="0.1.9" %}
{% set build_num=0 %}

package:
  name: apache-tvm-ffi
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: d2d402587e8906de0a07f4746aa78f3d452c7efe3625d4bb39ac2ad693bce530



build:
  number: {{ build_num }}
  #skip: true # [win]
  entry_points:
    - tvm-ffi-config = tvm_ffi.config:__main__
    - tvm-ffi-stubgen = tvm_ffi.stub.cli:__main__
  script:
    - export SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
    - $PYTHON -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja-base
    - make
  host:
    - python
    - pip
    - scikit-build-core >=0.10.0
    - cython >=3.0
    - setuptools-scm
  run:
    - python
    - typing-extensions >=4.5

test:
  imports:
    - tvm_ffi
  requires:
    - pip
  commands:
    - pip check
    - tvm-ffi-config --help
    - tvm-ffi-stubgen --help

  # NOTE: torch-c-dlpack-ext is an Ahead of Time compilation of some JIT
  # libraries that can be used as an optimization. It is NOT needed when
  # apache-tvm-ffi is used with torch >= 2.10, as torch has those
  # optimizations built in.
  # See: https://github.com/pytorch/pytorch/pull/165483
  # Combined with: https://github.com/apache/tvm-ffi/blob/main/python/tvm_ffi/_optional_torch_c_dlpack.py#L108
  # and https://github.com/apache/tvm-ffi/blob/main/addons/torch_c_dlpack_ext/build_backend.py#L72
  # This means that the torch-c-dlpack-ext won't get loaded on modern versions of pytorch (>= 2.10)


about:
  home: https://github.com/apache/tvm-ffi
  summary: TVM FFI - Foreign Function Interface for ML systems
  description: |
    TVM FFI is a lightweight foreign function interface library designed for
    machine learning systems. It provides efficient cross-language bindings
    between Python and C++.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  dev_url: https://github.com/apache/tvm-ffi
  doc_url: https://tvm.apache.org/ffi/


extra:
  recipe-maintainers:
    - iamthebot
